# dt-ocr configuration. This template lives at the repo root; rebuild_ex.ps1
# copies it next to dt-ocr.exe on every rebuild. The running exe reads
# dt-ocr.toml from its own directory. Bad values fall back to defaults with a
# warning in dt-ocr.log; hotkey bindings arrive with the P0.2 frame window.

[frame]
width     = 800   # default frame width, px (16..=20000)
height    = 600   # default frame height, px (16..=20000)
show_hint = true  # resize status strip (input left, current size right)
work_area = true  # true = keep out of the taskbar; false = use the full monitor
# font = "Cascadia Mono"  # status font (default Consolas; monospace recommended)

[ocr]
# Upscale the capture before recognition. 1 = native; 2-3 reads smaller,
# tighter screen fonts much better (same idea as ShareX's "scale factor").
# Automatically clamped down when the result would exceed the engine limit
# or the memory budget. Hot-reloads; applies to the next capture.
scale = 4
# Recognizer language: "auto" (CJK pack first, then English) or a tag such
# as "en", "zh". A missing pack falls back to auto with a warning.
language = "auto"

[mask]
# OCR result layer: "lines" = one continuous black band per OCR line segment
# (gaps between words are filled; glyphs stay at their recognised positions,
# so Latin spaces and CJK spacing are preserved), "boxes" = one box per word.
# Hot-reloads. Ignored in reader layout.
fill = "lines"
# "overlay" keeps the recognised positions; "reader" reflows the text as one
# wrapped page (a click copies the whole text).
layout = "overlay"
# Text face and size in points ("auto" = size each line from its source
# height). Defaults match the dotfiles WezTerm config: Sarasa Term SC Nerd 10.
font = "Sarasa Term SC Nerd"
size = 10

# action = "combo" — combo syntax: ctrl+alt+s, ^!s (AHK sigils), win+f2.
# NOTE: these are GLOBAL hotkeys. Defaults are chosen to avoid Windows
# defaults, but `pin` uses a three-modifier combo so plain Ctrl+T still reaches
# the foreground app — rebind if that bites.
[bindings]
draw    = "ctrl+alt+d"   # drag a rect on screen to place the frame (Esc cancels)
resize  = "ctrl+alt+s"   # enter/reset resize; unlocks pin; i=input, w/h=tune
pin     = "ctrl+shift+alt+t" # toggle Pin (blue, click-through) / Move (cyan)
capture = "ctrl+enter"   # copy the pixels under the frame; never changes mode
move    = "ctrl+alt+m"   # Move mode (cyan); unlocks pin
toggle  = "win+shift+o"  # show/hide the OCR layer (Win+O is reserved by Windows)

# resize accepts: 1600x900 (exact), 1600 (width px), x900 (height px),
# 40%x30% / 1/2x1/3 (independent width/height), 40% or 1/2 (both axes).
# % and fractions are of the DESKTOP (the work area of the monitor the
# frame is currently on), not of the frame itself.
