# dt-ocr configuration. This template lives at the repo root; tools\rebuild.ps1
# copies it next to dt-ocr.exe on every rebuild. The running exe reads
# dt-ocr.toml from its own directory. Bad values fall back to defaults with a
# warning in dt-ocr.log.

[frame]
width     = 800   # default frame width, px (16..=20000)
height    = 600   # default frame height, px (16..=20000)
show_hint = true  # resize status strip (input left, current size right)
work_area = true  # true = keep out of the taskbar; false = use the full monitor
# font = "Cascadia Mono"  # status font (default Consolas; monospace recommended)

[ocr]
# auto = RapidOCR plus Tesseract Latin correction, with Windows OCR fallback.
# rapid = RapidOCR only; tesseract = Tesseract only.
engine = "auto"
# Upscale the capture before recognition. 1 = native; 2-3 reads smaller,
# tighter screen fonts much better (same idea as ShareX's "scale factor").
# Automatically clamped down when the result would exceed the engine limit
# or the memory budget. Hot-reloads; applies to the next capture.
scale = 4
# Recognizer language: "auto" (RapidOCR mixed model, then Tesseract English
# correction) or a tag such as "en", "zh". External engines must be installed;
# auto falls back to the built-in Windows OCR when they are unavailable.
language = "auto"
# Automatic OCR is OFF until ctrl+shift+alt+o. After the framed source changes
# materially, the stale result is removed immediately; every further change
# restarts the settle timer, and OCR restarts only after the source has been
# stable for this long. The hotkey toggles the session off and closes the frame.
auto_delay_ms = 1000

[mask]
# "box" = leave source text untouched (default); "box+mask" = redraw words with
# the configured font and inverse background/text colours; "box+outside" =
# source untouched plus an editable multi-line orange editor below/right of the
# frame (preloaded with the OCR text, using `font` below).
mode = "box"
# Only box+mask uses fill: "lines" = one continuous band per OCR line segment,
# "boxes" = one block per word. Hot-reloads.
fill = "lines"
# Text face for box+mask and the outside editor (outside is fixed at 12 px,
# normal weight, monospace; default Sarasa Term SC Nerd). `size` in points
# applies to box+mask only ("auto" = size each line from its source height).
font = "Sarasa Term SC Nerd"
size = 10

# Ctrl+Shift+S on a focused Move/resize frame saves its region here with the
# default `dt-ocr-YYYYMMDD-HHMMSS.png` name, then closes the frame. Ctrl+S opens
# a save dialog starting in this directory (name prefilled); Ctrl+C copies the
# image. Pinning never writes a file. `%VAR%` expands; empty makes quick-save
# report an error.
[capture]
dir = "%USERPROFILE%\\Pictures\\dt-ocr"

# Tray notification after a manual OCR result or a quick-OCR copy. Off by
# default (silent); the tray icon must be present.
[notify]
enabled = false

# Pinned-image edge. "hatch" = translucent diagonal shadow (6 px, the
# default), "line" = one solid pixel using line-color, "none" = no edge.
# Hovering an edge shows only the resize-arrow cursor in every mode.
[pin]
border = "hatch"       # hatch | line | none
hatch-color = "cyan"   # colour name or #RRGGBB; only used by border = "hatch"
line-color = "black"   # colour name or #RRGGBB; only used by border = "line"

[external]
# Experimental and OFF by default (empty = disabled). Ctrl+F on a focused frame
# hands its rect to Flameshot. Flameshot's limitation: a preset region within
# 7 px of the screen origin pins at the top-left corner, so the bridge insets
# edge-touching frames (up to 6 px lost on that edge). Set to "flameshot" (PATH)
# or an absolute exe path to try it.
flameshot = ""
# Ctrl+O on a focused frame saves a temp PNG of the frame and opens it here
# (PATH name or absolute exe). Empty = disabled. Example: "photocraft".
editor = ""

# Recording (Ctrl+Alt+R on a visible frame starts/stops; the frame hides while
# recording so it never enters the video).
[record]
dir = "%USERPROFILE%\\Videos\\dt-ocr"   # %VAR% expanded, created on first use
name = "dt-ocr-{date}-{time}"           # {date} YYYYMMDD, {time} HHMMSS, {datetime}
fps = 30                                # clamped to 5..60
ffmpeg = "ffmpeg"                       # PATH name or absolute exe
# Desktop audio (WASAPI loopback of the default playback device). Captured as a
# separate WAV and muxed into the mp4 at stop; a missing device only warns.
audio = true
# x264 quality: lower = better/bigger, clamped to 16..34.
crf = 20
# Safeguards: auto-stop after this many minutes (0 = no limit) and refuse to
# start / stop early when the target volume has less free space than this.
max_minutes = 60
min_free_mb = 500

# action = "combo" — combo syntax: ctrl+alt+s, ^!s (AHK sigils), win+f2.
# NOTE: these are GLOBAL hotkeys. Defaults are chosen to avoid Windows
# defaults, but `pin` uses a three-modifier combo so plain Ctrl+T still reaches
# the foreground app — rebind if that bites.
[bindings]
draw    = "ctrl+alt+d"   # drag a rect on screen to place the frame (Esc cancels)
resize  = "ctrl+alt+s"   # enter/reset resize; unlocks pin; i=input, w/h=tune
pin     = "ctrl+shift+alt+t" # toggle Pin (blue, click-through) / Move (cyan)
capture = "ctrl+enter"   # copy the pixels under the frame; never changes mode
frame_window = "ctrl+alt+w"  # drop the frame on the focused window (no capture)
pin_shot = "ctrl+alt+p"  # quick pin (no file/clipboard); Ctrl+P = same for the frame
# Focused Move/resize frame: Esc closes; Ctrl+Shift+S saves+closes; Ctrl+S opens
# the save dialog; Ctrl+C copies+closes; Ctrl+A fills the whole current monitor
# (taskbar included) without changing the mode; Ctrl+O opens the capture in
# [external] editor; Ctrl+F hands the rect to Flameshot (experimental). Pinned
# ignores all of them.
move    = "ctrl+alt+m"   # Move mode (cyan); unlocks pin
toggle  = "win+shift+o"  # show/hide the OCR layer (Win+O is reserved by Windows)
quick_ocr = "ctrl+alt+o"        # draw a rect, OCR it, copy the text, then close the frame
auto_ocr  = "ctrl+shift+alt+o"  # draw or reuse the frame, OCR now, stay in automatic OCR
record    = "ctrl+alt+r"        # start/stop recording the frame rect (frame hides)
scale     = "ctrl+alt+z"        # fullscreen DWM-thumbnail zoom of the focused window
# Flameshot is not a global hotkey: with the frame focused, Ctrl+F hands the
# frame rect to Flameshot's own UI (Print stays Flameshot's key; disabled until
# [external] flameshot names the executable).
# Ctrl+O on a focused frame opens the capture in [external] editor.

# resize accepts: 1600x900 (exact), 1600 (width px), x900 (height px),
# 40%x30% / 1/2x1/3 (independent width/height), 40% or 1/2 (both axes).
# % and fractions are of the DESKTOP (the work area of the monitor the
# frame is currently on), not of the frame itself.
