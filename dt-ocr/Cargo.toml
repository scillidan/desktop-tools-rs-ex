[package]
name = "dt-ocr"
version = "0.1.0"
edition = "2021"
description = "OCR frame window + overlay (Text-Grab model)"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
dt-common = { path = "../dt-common" }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    # WinRT OCR (P0.3 interim engine; the P0.4 router replaces the choice).
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
