[package]
name = "dt-ocr"
version = "0.1.0"
edition = "2021"
description = "OCR frame window + overlay (Text-Grab model)"

[dependencies]
anyhow = "1"
dt-common = { path = "../dt-common" }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
